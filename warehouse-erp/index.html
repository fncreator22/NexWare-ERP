<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/warehouse-erp/" />
  <title>NexWare ERP — Enterprise Warehouse Management Platform</title>
  <meta name="description" content="NexWare ERP — Enterprise-grade multi-warehouse ERP, workforce, billing, and operations management SaaS platform." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    #app:empty::before {
      content: "Initializing NexWare ERP...";
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #94a3b8;
      font-family: sans-serif;
      font-size: 14px;
      background: #0f1029;
    }
  </style>
  <script>
    // Critical startup guard
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const appEl = document.getElementById('app');
      if (appEl && (!appEl.innerHTML || appEl.innerHTML.includes('Initializing'))) {
        appEl.innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0f1029;color:#f8fafc;font-family:sans-serif">
            <div style="text-align:center;max-width:480px;background:rgba(255,255,255,0.03);padding:40px;border-radius:24px;border:1px solid rgba(255,255,255,0.08)">
              <div style="margin-bottom:20px;display:flex;justify-content:center"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></div>
              <h1 style="font-size:20px;font-weight:700;margin-bottom:12px">System Initialization Failed</h1>
              <p style="color:#94a3b8;font-size:13px;line-height:1.6;margin-bottom:20px">
                The application encountered a critical error during startup. This is usually caused by a script failure or asset loading issue.
              </p>
              <div style="background:rgba(0,0,0,0.2);padding:12px;border-radius:8px;text-align:left;margin-bottom:20px">
                <code style="color:#f43f5e;font-size:11px">${msg}</code><br/>
                <code style="color:#64748b;font-size:10px">at ${url}:${lineNo}:${columnNo}</code>
              </div>
              <button onclick="location.reload()" style="background:#6366f1;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600">Try Again</button>
            </div>
          </div>
        `;
      }
      return false;
    };
  </script>
</head>
<body>
  <div id="app"></div>
  <!-- Bundled App -->
  <script src="bundle.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[WareOps PWA] Service worker registered:', reg.scope))
          .catch(err => console.warn('[WareOps PWA] Service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
